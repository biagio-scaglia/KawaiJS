<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="moonGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="roofFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Night Sky -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#nightSky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="200" cy="150" r="2.5" opacity="0.9"/>
    <circle cx="350" cy="80" r="1.5" opacity="0.6"/>
    <circle cx="520" cy="220" r="2" opacity="0.8"/>
    <circle cx="780" cy="110" r="3" opacity="0.9"/>
    <circle cx="950" cy="180" r="1.5" opacity="0.7"/>
    <circle cx="1120" cy="90" r="2" opacity="0.8"/>
    <circle cx="1300" cy="240" r="2.5" opacity="0.9"/>
    <circle cx="1580" cy="130" r="1.5" opacity="0.6"/>
    <circle cx="1750" cy="210" r="3" opacity="0.95"/>
    <circle cx="140" cy="300" r="2" opacity="0.5"/>
    <circle cx="450" cy="340" r="1.5" opacity="0.7"/>
  </g>

  <!-- Glowing Crescent/Full Moon -->
  <circle cx="1550" cy="220" r="90" fill="url(#moonGlow)"/>
  <circle cx="1550" cy="220" r="140" fill="#38bdf8" opacity="0.15"/>

  <!-- City Skyline in Distance -->
  <g fill="#090d16">
    <rect x="100" y="480" width="140" height="240"/>
    <rect x="280" y="420" width="180" height="300"/>
    <rect x="500" y="520" width="120" height="200"/>
    <rect x="650" y="380" width="220" height="340"/>
    <rect x="910" y="460" width="160" height="260"/>
    <rect x="1100" y="400" width="200" height="320"/>
    <rect x="1340" y="500" width="150" height="220"/>
    <rect x="1520" y="440" width="190" height="280"/>
    <rect x="1740" y="490" width="130" height="230"/>
  </g>

  <!-- Distant City Lights -->
  <g fill="#fef08a" opacity="0.6">
    <circle cx="140" cy="520" r="2"/>
    <circle cx="180" cy="560" r="2"/>
    <circle cx="320" cy="460" r="2.5" fill="#38bdf8"/>
    <circle cx="360" cy="510" r="2"/>
    <circle cx="400" cy="580" r="2"/>
    <circle cx="700" cy="420" r="2.5" fill="#f43f5e"/>
    <circle cx="750" cy="480" r="2"/>
    <circle cx="800" cy="540" r="2"/>
    <circle cx="1150" cy="440" r="2"/>
    <circle cx="1220" cy="510" r="2.5" fill="#38bdf8"/>
    <circle cx="1560" cy="480" r="2"/>
    <circle cx="1620" cy="550" r="2"/>
  </g>

  <!-- Rooftop Safety Fence / Mesh -->
  <line x1="0" y1="620" x2="1920" y2="620" stroke="#475569" stroke-width="8"/>
  <line x1="0" y1="520" x2="1920" y2="520" stroke="#475569" stroke-width="6"/>
  <line x1="0" y1="420" x2="1920" y2="420" stroke="#475569" stroke-width="6"/>
  <!-- Fence Poles -->
  <g stroke="#334155" stroke-width="8">
    <line x1="160" y1="380" x2="160" y2="700"/>
    <line x1="480" y1="380" x2="480" y2="700"/>
    <line x1="800" y1="380" x2="800" y2="700"/>
    <line x1="1120" y1="380" x2="1120" y2="700"/>
    <line x1="1440" y1="380" x2="1440" y2="700"/>
    <line x1="1760" y1="380" x2="1760" y2="700"/>
  </g>

  <!-- Rooftop Concrete Ground -->
  <polygon points="0,680 1920,680 1920,1080 0,1080" fill="url(#roofFloor)"/>
  <rect x="0" y="660" width="1920" height="30" fill="#1e293b"/>
</svg>
