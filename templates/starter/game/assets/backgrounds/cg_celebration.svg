<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="celSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="35%" stop-color="#4c0519"/>
      <stop offset="70%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#fb7185" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldBanner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Stage -->
  <rect width="1920" height="1080" fill="url(#celSky)"/>
  <rect width="1920" height="1080" fill="url(#centerGlow)"/>

  <!-- Light Rays / Sunburst -->
  <g opacity="0.18" fill="#ffffff">
    <polygon points="960,450 0,0 150,0"/>
    <polygon points="960,450 400,0 600,0"/>
    <polygon points="960,450 850,0 1070,0"/>
    <polygon points="960,450 1320,0 1520,0"/>
    <polygon points="960,450 1770,0 1920,0"/>
    <polygon points="960,450 1920,300 1920,450"/>
    <polygon points="960,450 1920,650 1920,800"/>
    <polygon points="960,450 0,300 0,450"/>
    <polygon points="960,450 0,650 0,800"/>
  </g>

  <!-- Confetti and Sparkles -->
  <g filter="url(#glow)">
    <!-- Confetti ribbons -->
    <rect x="250" y="180" width="30" height="12" rx="4" fill="#f43f5e" transform="rotate(25 250 180)"/>
    <rect x="420" y="120" width="28" height="10" rx="3" fill="#38bdf8" transform="rotate(-35 420 120)"/>
    <rect x="750" y="150" width="32" height="14" rx="4" fill="#facc15" transform="rotate(15 750 150)"/>
    <rect x="1180" y="110" width="30" height="12" rx="4" fill="#a855f7" transform="rotate(-20 1180 110)"/>
    <rect x="1450" y="170" width="26" height="10" rx="3" fill="#34d399" transform="rotate(40 1450 170)"/>
    <rect x="1680" y="240" width="34" height="14" rx="4" fill="#f43f5e" transform="rotate(-15 1680 240)"/>
    <rect x="180" y="380" width="28" height="12" rx="3" fill="#facc15" transform="rotate(55 180 380)"/>
    <rect x="1750" y="420" width="30" height="12" rx="4" fill="#38bdf8" transform="rotate(-45 1750 420)"/>
    
    <!-- Big Stars -->
    <path d="M 960,180 L 975,220 L 1020,225 L 985,255 L 995,300 L 960,275 L 925,300 L 935,255 L 900,225 L 945,220 Z" fill="#fef08a" opacity="0.9"/>
    <path d="M 320,280 L 330,305 L 360,310 L 335,330 L 342,360 L 320,345 L 298,360 L 305,330 L 280,310 L 310,305 Z" fill="#38bdf8" opacity="0.85"/>
    <path d="M 1600,280 L 1610,305 L 1640,310 L 1615,330 L 1622,360 L 1600,345 L 1578,360 L 1585,330 L 1560,310 L 1590,305 Z" fill="#f43f5e" opacity="0.85"/>
  </g>

  <!-- Celebratory Center Banner -->
  <g transform="translate(960, 360)">
    <rect x="-420" y="-55" width="840" height="110" rx="20" fill="rgba(15, 23, 42, 0.85)" stroke="url(#goldBanner)" stroke-width="4"/>
    <text x="0" y="8" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="44" font-weight="900" fill="url(#goldBanner)" text-anchor="middle" letter-spacing="2">EVENT CG • PROJECT COMPLETE!</text>
    <text x="0" y="38" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="4">KAWAIJS GAME DEVELOPMENT CLUB</text>
  </g>

  <!-- Yumia & Kaori Silhouette in Foreground / Duo Art -->
  <!-- Yumia (Left) -->
  <g transform="translate(560, 480)">
    <!-- Hair and Body Silhouette -->
    <path d="M 0,600 C -40,400 -120,300 -100,200 C -90,140 -50,90 0,70 C 50,90 90,140 100,200 C 120,300 40,400 0,600 Z" fill="#be123c"/>
    <circle cx="0" cy="180" r="110" fill="#fda4af"/>
    <!-- Twintails -->
    <path d="M -90,160 C -180,220 -200,380 -170,500 C -150,440 -120,300 -70,220 Z" fill="#f43f5e"/>
    <path d="M 90,160 C 180,220 200,380 170,500 C 150,440 120,300 70,220 Z" fill="#f43f5e"/>
    <!-- School Uniform -->
    <path d="M -130,600 L -90,300 L 90,300 L 130,600 Z" fill="#1e293b"/>
    <!-- Rose Ribbon -->
    <polygon points="0,320 -35,360 0,345 35,360" fill="#f43f5e"/>
    <!-- Joyful expression -->
    <path d="M -45,175 Q -30,160 -15,175" stroke="#881337" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 15,175 Q 30,160 45,175" stroke="#881337" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M -25,210 Q 0,250 25,210 Z" fill="#e11d48"/>
    <!-- Cheerful V-sign hand -->
    <path d="M -160,340 Q -190,260 -170,210 L -150,220 L -140,250 L -120,220 L -105,235 Q -120,300 -140,360 Z" fill="#fda4af"/>
  </g>

  <!-- Kaori (Right) -->
  <g transform="translate(1360, 480)">
    <!-- Hair and Body Silhouette -->
    <path d="M 0,600 C -40,400 -120,300 -100,200 C -90,130 -45,80 0,65 C 45,80 90,130 100,200 C 120,300 40,400 0,600 Z" fill="#0369a1"/>
    <circle cx="0" cy="180" r="105" fill="#bae6fd"/>
    <!-- Long Sleek Dark Blue Hair -->
    <path d="M -95,160 C -150,280 -160,450 -130,580 C -110,480 -90,320 -65,220 Z" fill="#0284c7"/>
    <path d="M 95,160 C 150,280 160,450 130,580 C 110,480 90,320 65,220 Z" fill="#0284c7"/>
    <!-- Glasses -->
    <rect x="-65" y="160" width="45" height="30" rx="6" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <rect x="20" y="160" width="45" height="30" rx="6" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <line x1="-20" y1="175" x2="20" y2="175" stroke="#38bdf8" stroke-width="4"/>
    <!-- School Uniform -->
    <path d="M -125,600 L -85,300 L 85,300 L 125,600 Z" fill="#0f172a"/>
    <!-- Cyan Tie -->
    <polygon points="0,320 -15,440 0,470 15,440" fill="#38bdf8"/>
    <!-- Proud Smile -->
    <path d="M -40,175 Q -25,168 -15,175" stroke="#0c4a6e" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 15,175 Q 25,168 40,175" stroke="#0c4a6e" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M -15,220 Q 0,235 20,220" stroke="#0369a1" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Vignette Border -->
  <rect width="1920" height="1080" fill="none" stroke="rgba(244, 63, 94, 0.4)" stroke-width="16"/>
</svg>
