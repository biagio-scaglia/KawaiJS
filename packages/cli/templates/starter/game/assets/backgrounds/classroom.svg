<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Sky & Window View -->
  <rect x="0" y="0" width="1920" height="1080" fill="#f1f5f9"/>
  <rect x="150" y="100" width="900" height="550" fill="url(#skyGrad)"/>
  
  <!-- Clouds -->
  <circle cx="350" cy="250" r="60" fill="#ffffff" opacity="0.8"/>
  <circle cx="420" cy="240" r="80" fill="#ffffff" opacity="0.9"/>
  <circle cx="500" cy="260" r="50" fill="#ffffff" opacity="0.8"/>

  <!-- Classroom Wall -->
  <rect x="0" y="0" width="1920" height="700" fill="url(#wallGrad)" fill-opacity="0.9"/>
  
  <!-- Large Window Frame -->
  <rect x="140" y="90" width="920" height="570" fill="none" stroke="#64748b" stroke-width="16"/>
  <line x1="600" y1="90" x2="600" y2="660" stroke="#64748b" stroke-width="12"/>
  <line x1="140" y1="375" x2="1060" y2="375" stroke="#64748b" stroke-width="12"/>

  <!-- Blackboard -->
  <rect x="1150" y="120" width="680" height="380" rx="8" fill="#1e293b" stroke="#78350f" stroke-width="14"/>
  <text x="1200" y="240" fill="#f8fafc" font-family="sans-serif" font-size="42" font-weight="bold">Welcome to Kawaijs!</text>
  <text x="1200" y="320" fill="#38bdf8" font-family="sans-serif" font-size="28">Web-native Visual Novel Engine</text>

  <!-- Wooden Floor -->
  <polygon points="0,700 1920,700 1920,1080 0,1080" fill="url(#floorGrad)"/>

  <!-- Floor Plank Lines -->
  <line x1="0" y1="780" x2="1920" y2="780" stroke="#451a03" stroke-width="3" opacity="0.4"/>
  <line x1="0" y1="880" x2="1920" y2="880" stroke="#451a03" stroke-width="3" opacity="0.4"/>
  <line x1="0" y1="980" x2="1920" y2="980" stroke="#451a03" stroke-width="3" opacity="0.4"/>
</svg>
