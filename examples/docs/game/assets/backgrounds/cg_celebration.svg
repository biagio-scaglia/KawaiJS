<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="celSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="35%" stop-color="#4c0519"/>
      <stop offset="70%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#fb7185" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldBanner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="yumiaHair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="yumiaUniform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="kaoriHair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="kaoriUniform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-30%" y="-10%" width="160%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#celSky)"/>
  <rect width="1920" height="1080" fill="url(#centerGlow)"/>

  <g opacity="0.18" fill="#ffffff">
    <polygon points="960,420 0,0 150,0"/>
    <polygon points="960,420 400,0 600,0"/>
    <polygon points="960,420 850,0 1070,0"/>
    <polygon points="960,420 1320,0 1520,0"/>
    <polygon points="960,420 1770,0 1920,0"/>
    <polygon points="960,420 1920,280 1920,430"/>
    <polygon points="960,420 1920,620 1920,780"/>
    <polygon points="960,420 0,280 0,430"/>
    <polygon points="960,420 0,620 0,780"/>
  </g>

  <g filter="url(#glow)">
    <rect x="250" y="180" width="30" height="12" rx="4" fill="#f43f5e" transform="rotate(25 250 180)"/>
    <rect x="420" y="120" width="28" height="10" rx="3" fill="#38bdf8" transform="rotate(-35 420 120)"/>
    <rect x="750" y="150" width="32" height="14" rx="4" fill="#facc15" transform="rotate(15 750 150)"/>
    <rect x="1180" y="110" width="30" height="12" rx="4" fill="#a855f7" transform="rotate(-20 1180 110)"/>
    <rect x="1450" y="170" width="26" height="10" rx="3" fill="#34d399" transform="rotate(40 1450 170)"/>
    <rect x="1680" y="240" width="34" height="14" rx="4" fill="#f43f5e" transform="rotate(-15 1680 240)"/>
    <rect x="180" y="380" width="28" height="12" rx="3" fill="#facc15" transform="rotate(55 180 380)"/>
    <rect x="1750" y="420" width="30" height="12" rx="4" fill="#38bdf8" transform="rotate(-45 1750 420)"/>
    <path d="M 960,150 L 975,190 L 1020,195 L 985,225 L 995,270 L 960,245 L 925,270 L 935,225 L 900,195 L 945,190 Z" fill="#fef08a" opacity="0.95"/>
    <path d="M 320,260 L 330,285 L 360,290 L 335,310 L 342,340 L 320,325 L 298,340 L 305,310 L 280,290 L 310,285 Z" fill="#38bdf8" opacity="0.85"/>
    <path d="M 1600,260 L 1610,285 L 1640,290 L 1615,310 L 1622,340 L 1600,325 L 1578,340 L 1585,310 L 1560,290 L 1590,285 Z" fill="#f43f5e" opacity="0.85"/>
  </g>

  <!-- Banner -->
  <g transform="translate(960, 250)">
    <rect x="-420" y="-55" width="840" height="110" rx="20" fill="rgba(15, 23, 42, 0.88)" stroke="url(#goldBanner)" stroke-width="4"/>
    <text x="0" y="5" font-family="'Segoe UI', system-ui, sans-serif" font-size="42" font-weight="900" fill="url(#goldBanner)" text-anchor="middle" letter-spacing="2">EVENT CG - PROJECT COMPLETE!</text>
    <text x="0" y="38" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="4">KAWAIJS GAME DEVELOPMENT CLUB</text>
  </g>

  <!-- YUMIA (left) - matches character sprite: rose hair, ahoge, white collar, red ribbon -->
  <g transform="translate(300, 280)" filter="url(#softShadow)">
    <!-- back hair -->
    <path d="M80 180 C40 450, 70 720, 120 860 C170 720, 140 450, 160 210 Z" fill="url(#yumiaHair)"/>
    <path d="M440 180 C480 450, 450 720, 400 860 C350 720, 380 450, 360 210 Z" fill="url(#yumiaHair)"/>
    <!-- body -->
    <path d="M180 420 L340 420 L390 980 L130 980 Z" fill="url(#yumiaUniform)"/>
    <polygon points="210,420 260,520 310,420 360,420 260,555 160,420" fill="#ffffff"/>
    <polygon points="240,505 280,505 300,585 260,550 220,585" fill="#f43f5e"/>
    <!-- neck + face -->
    <rect x="235" y="350" width="50" height="80" fill="#fed7aa"/>
    <ellipse cx="260" cy="290" rx="105" ry="120" fill="#ffedd5"/>
    <ellipse cx="190" cy="330" rx="20" ry="11" fill="#f43f5e" opacity="0.4"/>
    <ellipse cx="330" cy="330" rx="20" ry="11" fill="#f43f5e" opacity="0.4"/>
    <!-- happy eyes + smile -->
    <path d="M185 285 Q205 262 225 285" fill="none" stroke="#881337" stroke-width="7" stroke-linecap="round"/>
    <path d="M295 285 Q315 262 335 285" fill="none" stroke="#881337" stroke-width="7" stroke-linecap="round"/>
    <path d="M235 345 Q260 385 285 345 Z" fill="#e11d48"/>
    <!-- front hair + bangs + ahoge -->
    <path d="M155 210 C170 100, 350 100, 365 210 C340 245, 310 280, 285 245 C260 290, 240 290, 215 245 C190 280, 160 245, 155 210 Z" fill="url(#yumiaHair)"/>
    <path d="M145 200 C120 320, 135 420, 170 470 C150 400, 150 310, 160 225 Z" fill="url(#yumiaHair)"/>
    <path d="M375 200 C400 320, 385 420, 350 470 C370 400, 370 310, 360 225 Z" fill="url(#yumiaHair)"/>
    <path d="M260 115 Q285 35 325 60 Q295 70 268 115" fill="url(#yumiaHair)"/>
    <!-- wave hand -->
    <g transform="translate(-20, 470) rotate(-18)">
      <ellipse cx="40" cy="40" rx="38" ry="48" fill="#fed7aa"/>
      <path d="M20 10 Q10 -25 35 -30 Q45 -5 40 15" fill="#fed7aa"/>
      <path d="M45 5 Q55 -30 75 -25 Q70 0 55 18" fill="#fed7aa"/>
    </g>
    <!-- name plate -->
    <rect x="170" y="1000" width="180" height="42" rx="21" fill="rgba(15,23,42,0.75)" stroke="#f43f5e" stroke-width="2"/>
    <text x="260" y="1028" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="800" fill="#fda4af" letter-spacing="2">YUMIA</text>
  </g>

  <!-- KAORI (right) - matches sprite: cyan hair, glasses, pale collar, blue tie -->
  <g transform="translate(1120, 280)" filter="url(#softShadow)">
    <!-- back hair halo -->
    <ellipse cx="260" cy="300" rx="150" ry="160" fill="url(#kaoriHair)"/>
    <path d="M90 220 C50 420, 80 700, 130 860 C175 700, 150 420, 160 250 Z" fill="url(#kaoriHair)"/>
    <path d="M430 220 C470 420, 440 700, 390 860 C345 700, 370 420, 360 250 Z" fill="url(#kaoriHair)"/>
    <!-- body -->
    <path d="M180 420 L340 420 L390 980 L130 980 Z" fill="url(#kaoriUniform)"/>
    <polygon points="220,420 260,510 300,420 350,420 260,550 150,420" fill="#e0f2fe"/>
    <polygon points="245,485 275,485 288,590 260,620 232,590" fill="#0284c7"/>
    <!-- neck + face -->
    <rect x="235" y="350" width="50" height="80" fill="#fde68a"/>
    <ellipse cx="260" cy="290" rx="105" ry="120" fill="#fef3c7"/>
    <ellipse cx="190" cy="330" rx="18" ry="10" fill="#38bdf8" opacity="0.4"/>
    <ellipse cx="330" cy="330" rx="18" ry="10" fill="#38bdf8" opacity="0.4"/>
    <!-- glasses -->
    <rect x="175" y="262" width="70" height="46" rx="9" fill="none" stroke="#0f172a" stroke-width="5"/>
    <rect x="275" y="262" width="70" height="46" rx="9" fill="none" stroke="#0f172a" stroke-width="5"/>
    <line x1="245" y1="285" x2="275" y2="285" stroke="#0f172a" stroke-width="5"/>
    <!-- happy eyes + smile -->
    <path d="M190 285 Q210 265 228 285" fill="none" stroke="#0369a1" stroke-width="6" stroke-linecap="round"/>
    <path d="M292 285 Q310 265 328 285" fill="none" stroke="#0369a1" stroke-width="6" stroke-linecap="round"/>
    <path d="M235 350 Q260 375 285 350" fill="none" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/>
    <!-- bangs -->
    <path d="M145 210 C170 100, 350 100, 375 210 C340 235, 310 260, 275 235 C245 270, 225 270, 195 235 C170 260, 145 235, 145 210 Z" fill="url(#kaoriHair)"/>
    <path d="M135 205 C110 320, 130 420, 170 460 C145 390, 145 320, 150 225 Z" fill="url(#kaoriHair)"/>
    <path d="M385 205 C410 320, 390 420, 350 460 C375 390, 375 320, 370 225 Z" fill="url(#kaoriHair)"/>
    <!-- name plate -->
    <rect x="170" y="1000" width="180" height="42" rx="21" fill="rgba(15,23,42,0.75)" stroke="#38bdf8" stroke-width="2"/>
    <text x="260" y="1028" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="800" fill="#7dd3fc" letter-spacing="2">KAORI</text>
  </g>

  <rect width="1920" height="1080" fill="none" stroke="rgba(244, 63, 94, 0.4)" stroke-width="16"/>
</svg>
